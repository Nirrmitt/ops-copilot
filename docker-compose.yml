services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-only
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./data/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ops"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DATABASE_URL: postgresql+psycopg://ops_reader:change-me@db:5432/ops
      ALLOW_TICKET_ACTIONS: ${ALLOW_TICKET_ACTIONS:-false}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.chroma:/app/.chroma
      - ./.model-cache:/app/.model-cache
  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0"]
    environment:
      API_BASE_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  pgdata:
